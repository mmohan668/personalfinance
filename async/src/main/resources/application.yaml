server:
  port: 1004
  servlet:
    context-path: /pf-async
app:
  logging:
    directory: ${APP_LOG_DIR:E:/Files/logs}
spring:
  application:
    name: async
  datasource:
    url: jdbc:postgresql://localhost:5432/personal_finance_dev
    username: personal_finance_dev
    password: personal_finance_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  activemq:
    broker-url: tcp://localhost:61616

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.connections.pooling: WARN

async:
  scheduler-token: ${ASYNC_SCHEDULER_TOKEN:local-dev-only-change-before-production}

export:
  base-folder: E:/Files/bulk-exports
