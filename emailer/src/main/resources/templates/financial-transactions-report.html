<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Financial Transactions Report - ExpenseTrack</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      color: #333333;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 30px auto;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 10px;
      "
    >
      <h1 style="color: #198754; text-align: center">Financial Transactions Report</h1>

      <p>Hello <span th:text="${displayName}">there</span>,</p>

      <p>
        Your financial transactions report for
        <strong th:text="${periodLabel}">the selected period</strong>
        is attached as a CSV file.
      </p>

      <p>You can open the attachment in a spreadsheet application.</p>

      <p>Regards,<br /><strong>ExpenseTrack Team</strong></p>
    </div>
  </body>
</html>
