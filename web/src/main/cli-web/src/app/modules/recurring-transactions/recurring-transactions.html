<div class="search-section">
  <mat-expansion-panel class="search-panel" [expanded]="false">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon class="search-title-icon">tune</mat-icon>
        <span>Scheduler Rules</span>
      </mat-panel-title>
    </mat-expansion-panel-header>
  </mat-expansion-panel>
</div>
<section class="p-3">
  <div class="grid-container">
    <app-data-grid
      #dataGrid
      [gridName]="gridName"
      [gridExportFileName]="gridExportFileName"
      [dataKey]="dataKey"
      [toolbarConfig]="toolbarConfig"
      [calculateCellValue]="calculateCellValue"
      [addRow]="addRow"
      [editRow]="editRow"
      [deleteRow]="deleteRow"
      [activate]="activate"
      [inactivate]="inactivate"
    ></app-data-grid>
  </div>
</section>
