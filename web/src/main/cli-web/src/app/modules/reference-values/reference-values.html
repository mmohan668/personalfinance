<div>
  <mat-expansion-panel class="search-panel" [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title>Search Criteria</mat-panel-title>
    </mat-expansion-panel-header>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="search-fields">
        <mat-form-field appearance="fill" subscriptSizing="dynamic">
          <mat-label>Reference Object Name</mat-label>
          <input matInput type="text" formControlName="refObjName" />
        </mat-form-field>

        <mat-form-field appearance="fill" subscriptSizing="dynamic">
          <mat-label>Reference Code</mat-label>
          <input matInput type="text" formControlName="referenceCode" />
        </mat-form-field>

        <mat-form-field appearance="fill" subscriptSizing="dynamic">
          <mat-label>Active Status</mat-label>
          <mat-select formControlName="active">
            <mat-option value="">All</mat-option>
            <mat-option value="true">Active</mat-option>
            <mat-option value="false">Inactive</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="search-actions">
          <button mat-raised-button color="primary" type="submit">Search</button>
          <button mat-stroked-button type="button" (click)="resetSearchForm()">Clear</button>
        </div>
      </div>
    </form>
  </mat-expansion-panel>
</div>
<div class="grid-container">
  <app-data-grid
    #dataGrid
    [gridName]="gridName"
    [gridExportFileName]="gridExportFileName"
    [dataKey]="dataKey"
    [toolbarConfig]="toolbarConfig"
    [addRow]="addRow"
    [editRow]="editRow"
    [deleteRow]="deleteRow"
    [activate]="activate"
    [inactivate]="inactivate"
    [copyRow]="copyRow"
    [calculateCellValue]="calculateCellValue"
    [booleanOptions]="_cs.activeInactiveBooleanOptions"
  ></app-data-grid>
</div>
