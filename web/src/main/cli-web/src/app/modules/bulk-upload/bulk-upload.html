<div class="bulk-upload-page">
  <mat-expansion-panel class="search-panel" [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title> Bulk Upload </mat-panel-title>

      <mat-panel-description>
        Select the type of data and upload an Excel file.
      </mat-panel-description>
    </mat-expansion-panel-header>

    <div class="upload-section">
      <div class="form-content">
        <div class="upload-type-row">
          <fieldset class="upload-type-field">
            <legend>Upload Type</legend>

            <select id="uploadType" [(ngModel)]="selectedUploadType">
              <option value="" disabled>Select upload type</option>

              @for (type of uploadTypes; track type.value) {
                <option [value]="type.value">
                  {{ type.label }}
                </option>
              }
            </select>
          </fieldset>

          <button
            type="button"
            class="secondary-button download-template-button"
            [disabled]="!selectedUploadType"
            (click)="downloadTemplate()"
          >
            Download Template
          </button>
        </div>

        <div class="form-field">
          <div class="file-upload">
            <label for="bulkUploadFile" class="choose-file-button"> Choose File </label>

            <input
              id="bulkUploadFile"
              type="file"
              accept=".xlsx"
              hidden
              (change)="onFileSelected($event)"
            />

            <span class="file-name">
              {{ selectedFile?.name || 'No file selected' }}
            </span>
          </div>

          @if (fileError) {
            <div class="file-error">
              {{ fileError }}
            </div>
          }
        </div>
      </div>

      <div class="actions">
        <button type="button" class="secondary-button" (click)="reset()">Reset</button>

        <button type="button" class="primary-button" [disabled]="!canSubmit" (click)="submit()">
          Submit
        </button>
      </div>
    </div>
  </mat-expansion-panel>

  <div class="grid-container">
    <app-data-grid
      #dataGrid
      [gridName]="gridName"
      [additionalFilters]="additionalFilters"
      [gridExportFileName]="gridExportFileName"
      [dataKey]="dataKey"
      [toolbarConfig]="toolbaConfig"
      [downloadFile]="downloadFile"
      [hasValue]="hasValue"
    ></app-data-grid>
  </div>
</div>
