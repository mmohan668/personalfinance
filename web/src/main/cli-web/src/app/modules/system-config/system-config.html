<div class="search-section">
  <mat-expansion-panel class="search-panel" [expanded]="false">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon class="search-title-icon">tune</mat-icon>
        <span>System Configuration</span>
      </mat-panel-title>
    </mat-expansion-panel-header>
  </mat-expansion-panel>
</div>
<div class="grid-container">
  <app-data-grid
    #dataGrid
    [gridName]="gridName"
    [gridExportFileName]="gridExportFileName"
    [dataKey]="dataKey"
    [toolbarConfig]="toolbarConfig"
    [hyperlinkAction]="hyperlinkAction"
  ></app-data-grid>
</div>
