<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <!-- Title Bar -->
  <div class="dialog-title-bar" cdkDragHandle>
    <div class="dialog-heading">
      <mat-icon class="dialog-heading-icon">settings_applications</mat-icon>
      <span class="dialog-title">
        {{ 'Update System ' + this.data.configName }}
      </span>
    </div>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <form [formGroup]="form" class="dialog-form-1">
      <mat-form-field appearance="outline" floatLabel="always" class="dialog-field">
        <mat-label>Configured Value</mat-label>

        <mat-select formControlName="configValue" name="configValue">
          @for (item of referenceCodes(); track item.value) {
            <mat-option [value]="item.value">
              {{ item.label }}
            </mat-option>
          }
        </mat-select>

        @if (_cs.isInvalid(form.get('currency'))) {
          <mat-error>
            {{ _cs.getValidationMessage(form.get('currency'), 'Currency') }}
          </mat-error>
        }
      </mat-form-field>
    </form>
  </div>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    <!-- Reset -->
    <button mat-stroked-button type="button" (click)="form.reset()" class="dialog-reset-button">
      <mat-icon>refresh</mat-icon>
      Reset
    </button>

    <span class="action-spacer"></span>

    <!-- Close -->
    <button
      mat-stroked-button
      type="button"
      (click)="dialogRef.close()"
      class="dialog-cancel-button"
    >
      <mat-icon>close</mat-icon>
      Close
    </button>

    <!-- Save -->
    <button
      mat-raised-button
      type="button"
      [disabled]="form.invalid || form.pristine"
      class="dialog-save-button"
      (click)="save()"
    >
      <mat-icon>save</mat-icon>
      Save
    </button>
  </mat-dialog-actions>
</div>
