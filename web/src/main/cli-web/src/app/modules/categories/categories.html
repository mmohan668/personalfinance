<div class="search-section">
  <mat-expansion-panel class="search-panel" [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon class="search-title-icon">tune</mat-icon>
        <span>Search Criteria</span>
      </mat-panel-title>
    </mat-expansion-panel-header>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="search-fields">
        <!-- Transaction Type -->
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Transaction Type</mat-label>
          <input matInput type="text" formControlName="transactionType" />
        </mat-form-field>

        <!-- Category Name -->
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Category Name</mat-label>
          <input matInput type="text" formControlName="categoryName" />
        </mat-form-field>

        <!-- Active Status -->
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Active Status</mat-label>
          <mat-select formControlName="active">
            <mat-option value="">All</mat-option>
            <mat-option value="true">Active</mat-option>
            <mat-option value="false">Inactive</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Search and Clear Actions -->
        <div class="search-actions">
          <button mat-flat-button color="primary" type="submit" class="search-button">
            <mat-icon>search</mat-icon>
            Search
          </button>

          <button mat-stroked-button type="button" class="clear-button" (click)="resetSearchForm()">
            <mat-icon>refresh</mat-icon>
            Clear
          </button>
        </div>
      </div>
    </form>
  </mat-expansion-panel>
</div>

<div class="grid-container">
  <app-data-grid
    #dataGrid
    [gridName]="gridName"
    [calculateCellValue]="calculateCellValue"
    [gridExportFileName]="gridExportFileName"
    [dataKey]="dataKey"
    [toolbarConfig]="toolbaConfig"
    [addRow]="addRow"
    [editRow]="editRow"
    [deleteRow]="deleteRow"
    [activate]="activate"
    [inactivate]="inactivate"
  ></app-data-grid>
</div>
