<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <!-- Title Bar -->
  <div class="dialog-title-bar" cdkDragHandle>
    <span class="dialog-title">
      @if (data.mode === MODES.ADD) {
        Add Reference Object
      } @else {
        Edit Reference Object
      }
    </span>

    <button mat-icon-button type="button" aria-label="Close" (click)="dialogRef.close()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <form [formGroup]="form" class="dialog-form-1">
      <mat-form-field appearance="fill" class="dialog-field">
        <mat-label>Reference Object Name</mat-label>
        <input matInput type="text" name="refObjName" formControlName="refObjName" />
        @if (_cs.isInvalid(form.get('refObjName'))) {
          <mat-error>
            {{ _cs.getValidationMessage(form.get('refObjName'), 'Reference Object Name') }}
          </mat-error>
        }
      </mat-form-field>
    </form>
  </div>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    <button mat-stroked-button type="button" (click)="form.reset()">Reset</button>

    <span class="action-spacer"></span>

    <button mat-stroked-button type="button" (click)="dialogRef.close()">Close</button>

    <button
      mat-raised-button
      type="button"
      [disabled]="form.invalid || form.pristine"
      (click)="save()"
    >
      Save
    </button>
  </mat-dialog-actions>
</div>
