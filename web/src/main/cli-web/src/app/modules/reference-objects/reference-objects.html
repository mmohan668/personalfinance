<section class="grid-section">
  <div class="section-header">
    <h3>Reference Objects</h3>
  </div>
  <div class="grid-container">
    <app-data-grid
      #dataGrid
      [gridName]="gridName"
      [gridExportFileName]="gridExportFileName"
      [dataKey]="dataKey"
      [toolbarConfig]="toolbarConfig"

  </div>
