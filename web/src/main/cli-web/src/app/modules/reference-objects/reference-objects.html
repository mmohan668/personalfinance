<div class="search-section">
  <mat-expansion-panel class="search-panel" [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title
        ><mat-icon class="search-title-icon">tune</mat-icon>
        <span>Search Criteria</span></mat-panel-title
      >
    </mat-expansion-panel-header>

    <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="search-fields" [ngClass]="'fields-' + fieldCount">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Reference Object Name</mat-label>
          <input matInput type="text" formControlName="refObjName" />
        </mat-form-field>
        <div></div>
        <div></div>

        <!-- Search and Clear Actions -->
        <div class="search-actions">
          <button mat-flat-button color="primary" type="submit" class="search-button">
            <mat-icon>search</mat-icon>
            Search
          </button>

          <button mat-stroked-button type="button" class="clear-button" (click)="resetSearchForm()">
            <mat-icon>refresh</mat-icon>
            Clear
          </button>
        </div>
      </div>
    </form>
  </mat-expansion-panel>
</div>
<div class="grid-container">
  <app-data-grid
    #dataGrid
    [gridName]="gridName"
    [gridExportFileName]="gridExportFileName"
    [dataKey]="dataKey"
    [toolbarConfig]="toolbarConfig"
  ></app-data-grid>
</div>
