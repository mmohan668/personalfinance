<div class="search-section">
  <mat-expansion-panel class="search-panel" [expanded]="false">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon class="search-title-icon">tune</mat-icon>
        <span>User Management</span>
      </mat-panel-title>
    </mat-expansion-panel-header>
  </mat-expansion-panel>
</div>
<div class="grid-container">
  <app-data-grid
    #dataGrid
    [gridName]="gridName"
    [calculateCellValue]="calculateCellValue"
    [fetchBooleanOptions]="fetchBooleanOptions"
    [gridExportFileName]="gridExportFileName"
    [dataKey]="dataKey"
    [toolbarConfig]="toolbaConfig"
    [addRow]="addRow"
    [editRow]="editRow"
    [deleteRow]="deleteRow"
    [activate]="activate"
    [inactivate]="inactivate"
    [permissionsAction]="managePermissions"
  ></app-data-grid>
</div>
