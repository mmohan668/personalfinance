<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <!-- Title Bar -->
  <div class="dialog-title-bar" cdkDragHandle>
    <span class="dialog-title">
      {{ data.title }}
    </span>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <p class="dialog-message" [innerHTML]="data.message"></p>

    <mat-radio-group
      class="choice-radio-group"
      [(ngModel)]="selectedAnswer"
      aria-label="Select Yes or No"
    >
      <mat-radio-button value="Yes"> Yes </mat-radio-button>

      <mat-radio-button value="No"> No </mat-radio-button>
    </mat-radio-group>
  </div>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    <button
      mat-icon-button
      type="button"
      class="dialog-cancel-button"
      aria-label="Close"
      (click)="dialogRef.close(false)"
    >
      <mat-icon>close</mat-icon>
      Close
    </button>
    <span class="action-spacer"></span>
    <button
      mat-raised-button
      type="button"
      class="dialog-save-button"
      [disabled]="!selectedAnswer"
      (click)="submit()"
    >
      <mat-icon>check_circle</mat-icon>
      Submit
    </button>
  </mat-dialog-actions>
</div>
