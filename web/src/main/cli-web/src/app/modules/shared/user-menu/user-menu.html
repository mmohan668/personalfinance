<header class="user-menu">
  <!-- Brand -->
  <div class="brand">
    <span class="brand-icon">
      <img src="../../../assets/expense-track.png" width="28" alt="ExpenseTrack" />
    </span>

    <span class="brand-expense"> Expense<span class="brand-highlight">Track</span> </span>
  </div>

  <!-- Right-side actions -->
  <div class="menu-actions">
    <button
      type="button"
      class="icon-button"
      title="Help & Support"
      aria-label="Help and Support"
      (click)="openHelp()"
    >
      <i class="bi bi-question-circle"></i>
    </button>

    <button
      type="button"
      class="icon-button"
      title="About"
      aria-label="About"
      (click)="openAbout()"
    >
      <i class="bi bi-info-circle"></i>
    </button>

    <!-- Profile -->
    <div class="profile-container">
      <button
        type="button"
        class="profile-button"
        aria-label="User profile menu"
        [attr.aria-expanded]="profileMenuOpen"
        (click)="toggleProfileMenu()"
      >
        <img
          class="user-avatar"
          [src]="profilePictureUrl() || 'assets/image.png'"
          [alt]="_cs?.getUserProfile?.username || 'User profile'"
        />

        <span class="user-details">
          <span class="user-name">
            {{ _cs?.getUserProfile?.username || 'User' }}
          </span>

          <span class="user-email">
            {{ _cs?.getUserProfile?.email || '' }}
          </span>
        </span>

        <i
          class="bi"
          [class.bi-chevron-down]="!profileMenuOpen"
          [class.bi-chevron-up]="profileMenuOpen"
        ></i>
      </button>

      <!-- Profile dropdown -->
      @if (profileMenuOpen) {
        <div class="profile-dropdown">
          <!-- Dropdown profile header -->
          <div class="dropdown-header">
            <img
              class="dropdown-avatar"
              [src]="profilePictureUrl() || 'assets/image.png'"
              [alt]="_cs?.getUserProfile?.username || 'User profile'"
            />

            <div class="dropdown-user-details">
              <strong>
                {{ _cs?.getUserProfile?.username || 'User' }}
              </strong>

              <small>
                {{ _cs?.getUserProfile?.email || '' }}
              </small>

              <!-- Edit profile picture -->
              <button
                type="button"
                class="edit-profile-picture"
                (click)="openProfilePictureDialog($event)"
              >
                <i class="bi bi-camera-fill"></i>
                <span>Edit profile picture</span>
              </button>
            </div>
          </div>

          <div class="dropdown-divider"></div>

          <!-- Existing menu items -->
          <button type="button" class="dropdown-item" (click)="changePassword()">
            <i class="bi bi-shield-lock"></i>
            <span>Change Password</span>
          </button>

          <button type="button" class="dropdown-item" (click)="openAbout()">
            <i class="bi bi-info-circle"></i>
            <span>About</span>
          </button>

          <button type="button" class="dropdown-item" (click)="openHelp()">
            <i class="bi bi-question-circle"></i>
            <span>Help &amp; Support</span>
          </button>

          <div class="dropdown-divider"></div>

          <button type="button" class="dropdown-item logout-item" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
