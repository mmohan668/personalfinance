<div class="dialog-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <!-- Title Bar -->
  <div class="dialog-title-bar" cdkDragHandle>
    <span class="dialog-title">
      {{ data.title }}
    </span>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <p class="dialog-message" [innerHTML]="data.message"></p>
  </div>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    @if (!data.isNotification) {
      <button
        mat-stroked-button
        type="button"
        class="dialog-cancel-button"
        (click)="dialogRef.close(false)"
      >
        <mat-icon>close</mat-icon>
        No
      </button>

      <button
        mat-raised-button
        type="button"
        class="dialog-save-button"
        (click)="dialogRef.close(true)"
      >
        <mat-icon>check</mat-icon>
        Yes
      </button>
    } @else {
      <button
        mat-raised-button
        type="button"
        class="dialog-save-button"
        (click)="dialogRef.close(true)"
      >
        <mat-icon>check_circle</mat-icon>
        OK
      </button>
    }
  </mat-dialog-actions>
</div>
