<ng-template #notificationTemplate>
  <div class="notification-container">
    <div
      class="notification"
      role="alert"
      aria-live="assertive"
      [class.success]="notificationService.item()?.type === 'success'"
      [class.error]="notificationService.item()?.type === 'error'"
      (mouseenter)="pause()"
      (mouseleave)="resume()"
    >
      <div class="notification-content">
        <span class="icon" aria-hidden="true">
          @if (notificationService.item()?.type === 'success') {
            ✓
          } @else {
            !
          }
        </span>

        <span class="message">
          {{ notificationService.item()?.message }}
        </span>
      </div>

      <button type="button" class="close-button" aria-label="Close notification" (click)="close()">
        ×
      </button>
    </div>
  </div>
</ng-template>
