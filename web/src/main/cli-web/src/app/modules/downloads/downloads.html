<div class="search-section">
  <mat-expansion-panel class="search-panel" [expanded]="false">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon class="search-title-icon">tune</mat-icon>
        <span>Server Side Exports</span>
      </mat-panel-title>
    </mat-expansion-panel-header>
  </mat-expansion-panel>
</div>
<div class="grid-container">
  <app-data-grid
    #dataGrid
    [gridName]="gridName"
    [dataKey]="dataKey"
    [toolbarConfig]="toolbaConfig"
    [hasValue]="hasValue"
    [downloadFile]="downloadFile"
    [enableSelection]="false"
    [formatSize]="formatSize"
    groupBy="groupName"
    [showPager]="false"
    [getGroupColumnHeader]="getGroupColumnHeader"
  ></app-data-grid>
</div>
