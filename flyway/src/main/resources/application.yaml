spring:
  application:
    name: flyway
  datasource:
    url: jdbc:postgresql://localhost:5432/personal_finance_dev
    username: personal_finance_dev
    password: personal_finance_dev
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations:
      - classpath:db/migration/repeated
      - classpath:db/migration/versioned
    schemas: public
    validate-on-migrate: true
    table: flyway_schema_history_pf

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
